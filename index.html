<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>GymBro</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <button class="icon-btn" id="btnBack" hidden aria-label="Indietro">‹</button>
        <h1 class="app-title" id="viewTitle">GymBro</h1>
        <button class="icon-btn" id="btnMenu" aria-label="Menu">⋮</button>
      </div>
    </header>

    <!-- Main view container -->
    <main id="view"></main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" data-nav="schede">
        <span class="nav-icon">📋</span><span class="nav-label">Schede</span>
      </button>
      <button class="nav-btn" data-nav="esercizi">
        <span class="nav-icon">🏋️</span><span class="nav-label">Esercizi</span>
      </button>
      <button class="nav-btn" data-nav="grafici">
        <span class="nav-icon">📈</span><span class="nav-label">Grafici</span>
      </button>
      <button class="nav-btn" data-nav="impostazioni">
        <span class="nav-icon">⚙️</span><span class="nav-label">Altro</span>
      </button>
    </nav>
  </div>

  <!-- Modal container -->
  <div id="modalRoot"></div>
  <!-- Toast container -->
  <div id="toastRoot" class="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
